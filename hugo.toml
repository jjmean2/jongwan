baseURL = 'https://blog.justwonder.me/'
locale = 'ko-KR'
title = 'Jongwan Lee'

[outputs]
home = ["HTML", "RSS", "JSON"]

[params.profileMode]
enabled = false
title = "이종완 (Jongwan Lee)"
subtitle = "공식 문서와 논리를 바탕으로 견고한 제품을 만드는 10년 차 엔지니어입니다."
imageUrl = "본인_사진_경로"                                   # 생략 가능
imageTitle = "Jongwan"

[markup]
[markup.goldmark]
[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]


[markup.goldmark.parser.attribute]
block = true
title = true

[params]
math = true
[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
limit = 10
keys = ["title", "permalink", "summary", "content"]

[[params.profileMode.buttons]]
name = "Projects"
url = "/posts"    # 글 목록으로 연결

[[params.profileMode.buttons]]
name = "GitHub"
url = "https://github.com/jjmean2"

[[menu.main]]
identifier = "search"
name = "검색"
url = "/search/"
weight = 10

[services]
[services.googleAnalytics]
ID = 'G-X28QBQ329W'

[module]
[[module.imports]]
path = "github.com/adityatelange/hugo-PaperMod"

[taxonomies]
tag = "tags"
category = "categories"
